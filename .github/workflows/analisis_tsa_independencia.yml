name: Analisis TSA Independencia

on:
  workflow_dispatch: {}  # se lanza a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Run analisis
        run: python analisis_tsa_independencia.py

      - name: Commit results
        run: |
          git config user.name "koncorde-bot"
          git config user.email "actions@github.com"
          git add analisis_tsa_independencia.md
          git diff --staged --quiet || git commit -m "Analisis TSA independencia [skip ci]"
          git pull --rebase || true
          git push
