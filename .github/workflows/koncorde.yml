name: Koncorde Alert

on:
  schedule:
    # Cada 15 minutos (temporalmente, para diagnosticar por que no salta el
    # cron automatico). Minutos 7/22/37/52 para evitar la congestion de
    # :00/:15/:30/:45.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para poder commitear state.json

jobs:
  check-koncorde:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Koncorde check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python koncorde_alert.py

      - name: Commit updated state (anti-duplicados)
        run: |
          git config user.name "koncorde-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
