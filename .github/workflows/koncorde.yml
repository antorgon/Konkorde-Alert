name: Koncorde Alert

on:
  schedule:
    # Cada 30 minutos. Como las velas son de 1h, esto simplemente reduce el
    # margen de espera tras el cierre de cada vela (antes podia tardar hasta
    # ~60 min en detectarse, ahora hasta ~30 min).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para poder commitear state.json

jobs:
  check-koncorde:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Koncorde check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python koncorde_alert.py

      - name: Commit updated state (anti-duplicados)
        run: |
          git config user.name "koncorde-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
