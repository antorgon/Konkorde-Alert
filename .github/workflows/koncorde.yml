name: Koncorde Alert

on:
  schedule:
    # Cada 30 minutos, pero en los minutos 7 y 37 en vez de 0 y 30.
    # GitHub retrasa o incluso salta ejecuciones programadas en momentos de
    # mucha carga, y :00/:30 son los minutos mas usados por todo GitHub para
    # sus crons -> mayor probabilidad de que se pierda la ejecucion. Un
    # minuto "impar" evita gran parte de esa congestion.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para poder commitear state.json

jobs:
  check-koncorde:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Koncorde check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python koncorde_alert.py

      - name: Commit updated state (anti-duplicados)
        run: |
          git config user.name "koncorde-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
