name: Koncorde Alert

on:
  workflow_dispatch: {}
  schedule:
    - cron: "13 4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: koncorde-loop
  cancel-in-progress: false

jobs:
  check-koncorde:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bucle de chequeos cada 5 min durante ~5h40m
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          git config user.name "koncorde-bot"
          git config user.email "actions@github.com"

          END=$((SECONDS + 20400))
          while [ $SECONDS -lt $END ]; do
            # Mantener la copia local sincronizada antes de procesar.
            git pull --rebase origin "$GITHUB_REF_NAME"

            python koncorde_alert.py || echo "::error::Falló una ejecución de koncorde_alert.py"
            test -f state.json || printf '{}\n' > state.json
            touch signals_history.jsonl
            git add state.json signals_history.jsonl
            if ! git diff --staged --quiet; then
              git commit -m "Update alert state and signal history [skip ci]"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi

            sleep 300
          done

      - name: Relanzar el siguiente ciclo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/koncorde.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' \
            && echo "Siguiente ciclo lanzado correctamente" \
            || echo "::error::No se pudo relanzar el siguiente ciclo"
