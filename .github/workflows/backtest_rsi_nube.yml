name: Backtest RSI Nube

on:
  workflow_dispatch: {}  # se lanza a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Run backtest
        run: python backtest_rsi_nube.py

      - name: Commit results
        run: |
          git config user.name "koncorde-bot"
          git config user.email "actions@github.com"
          git add backtest_rsi_nube.md
          git diff --staged --quiet || git commit -m "Backtest RSI+Nube [skip ci]"
          git pull --rebase || true
          git push
